name: Lean actions 

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-twophase:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: "./twophase"

      - name: Simulate twophase
        run: |
          cd twophase
          lake exec RunTwophase4 100000 50 consistentInv $(date +%s)

  build-epfd:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: "./epfd"

  build-ben-or:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: "./Ben-Or"
